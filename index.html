<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>git-translate | Code Translator</title>
    <!-- Google Fonts & Material Icons -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Open+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header / Google Style Navbar -->
    <header class="gt-navbar">
        <div class="gt-nav-brand">
            <span class="material-symbols-outlined brand-icon">translate</span>
            <span class="brand-text">git<span class="brand-accent">-translate</span></span>
        </div>
        <div class="gt-nav-links">
            <a href="https://github.com" target="_blank" class="github-btn">
                <span>View on GitHub</span>
                <span class="material-symbols-outlined text-sm">open_in_new</span>
            </a>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="gt-container">
        
        <!-- Main Translator Card Wrapper -->
        <div class="translator-card">
            
            <!-- Tab Headers with Language Selectors (Estilo Google) -->
            <div class="lang-tabs-bar">
                
                <!-- Left Source Select -->
                <div class="source-tabs">
                    <div class="select-wrapper">
                        <select id="sourceLang" class="lang-dropdown">
                            <option value="javascript_obj" selected>JavaScript Object</option>
                            <option value="json">JSON Data</option>
                        </select>
                        <span class="material-symbols-outlined dropdown-arrow">arrow_drop_down</span>
                    </div>
                </div>

                <!-- Swap Button Middle -->
                <div class="swap-action">
                    <button class="icon-btn-circle" id="swapBtn" title="Swap languages">
                        <span class="material-symbols-outlined">swap_horiz</span>
                    </button>
                </div>

                <!-- Right Target Select -->
                <div class="target-tabs">
                    <div class="select-wrapper">
                        <select id="targetLang" class="lang-dropdown">
                            <option value="css" selected>Pure CSS</option>
                            <option value="tailwind" disabled>Tailwind Utility Class (Soon)</option>
                        </select>
                        <span class="material-symbols-outlined dropdown-arrow">arrow_drop_down</span>
                    </div>
                    
                    <!-- Translate Action Button Right-Aligned -->
                    <button id="translateBtn" class="primary-action-btn">
                        <span>Translate</span>
                    </button>
                </div>
            </div>

            <!-- Two-Way Editing Grid -->
            <div class="translation-grid">
                
                <!-- Input Panel -->
                <div class="panel input-panel">
                    <textarea id="inputCode" placeholder="Paste your source structure here..." spellcheck="false">{
  backgroundColor: "indigo",
  padding: "16px",
  borderRadius: "8px",
  color: "#ffffff"
}</textarea>
                    
                    <div class="panel-footer">
                        <span class="panel-info-tag" id="sourceTag">Source Code</span>
                        <button id="clearBtn" class="icon-btn-circle" title="Clear text">
                            <span class="material-symbols-outlined">close</span>
                        </button>
                    </div>
                </div>

                <!-- Output Panel -->
                <div class="panel output-panel">
                    <textarea id="outputCode" readonly placeholder="Translation" spellcheck="false"></textarea>
                    
                    <div class="panel-footer">
                        <span class="panel-info-tag" id="targetTag">Compiled CSS</span>
                        <button id="copyBtn" class="icon-btn-circle" title="Copy code">
                            <span class="material-symbols-outlined">content_copy</span>
                            <span id="copyText" class="tooltip-text">Copied!</span>
                        </button>
                    </div>
                </div>

            </div>
        </div>

        <!-- Footer Caption -->
        <p class="gt-footer-text">
            git-translate Engine &middot; Open Source syntax compilation utility.
        </p>

    </main>

    <!-- JavaScript Engine -->
    <script>
        const inputCode = document.getElementById('inputCode');
        const outputCode = document.getElementById('outputCode');
        const translateBtn = document.getElementById('translateBtn');
        const clearBtn = document.getElementById('clearBtn');
        const copyBtn = document.getElementById('copyBtn');
        const copyText = document.getElementById('copyText');
        const sourceLang = document.getElementById('sourceLang');
        const targetLang = document.getElementById('targetLang');
        const sourceTag = document.getElementById('sourceTag');
        const targetTag = document.getElementById('targetTag');

        // Core compilation logic
        function compileCode() {
            const source = inputCode.value;
            const mode = sourceLang.value;

            if (!source.trim()) {
                outputCode.value = "";
                return;
            }

            try {
                let cleaned = source.trim();
                let obj;

                // Handle format parsing depending on selector
                if (mode === 'json') {
                    obj = JSON.parse(cleaned);
                } else {
                    if (!cleaned.startsWith('{')) cleaned = `{${cleaned}}`;
                    obj = new Function(`return ${cleaned}`)();
                }
                
                let cssResult = ".translated-style {\n";
                for (const [key, value] of Object.entries(obj)) {
                    const cssProperty = key.replace(/([A-Z])/g, "-$1").toLowerCase();
                    cssResult += `  ${cssProperty}: ${value};\n`;
                }
                cssResult += "}";
                outputCode.value = cssResult;
            } catch (error) {
                outputCode.value = `/* Syntax Error */\nCould not compile structure. Ensure it fits a valid ${sourceLang.options[sourceLang.selectedIndex].text} format.`;
            }
        }

        // Event Listeners
        translateBtn.addEventListener('click', compileCode);
        
        sourceLang.addEventListener('change', () => {
            sourceTag.textContent = sourceLang.options[sourceLang.selectedIndex].text;
            compileCode();
        });

        clearBtn.addEventListener('click', () => {
            inputCode.value = '';
            outputCode.value = '';
        });

        copyBtn.addEventListener('click', () => {
            if(!outputCode.value || outputCode.value.startsWith('/* Syntax')) return;
            navigator.clipboard.writeText(outputCode.value);
            copyText.classList.add('show');
            setTimeout(() => { copyText.classList.remove('show'); }, 2000);
        });

        // Initialize on load
        window.addEventListener('DOMContentLoaded', () => {
            if(inputCode.value.trim()) compileCode();
        });
    </script>
</body>
</html>
