<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>git-translate | Code Translator</title>
    <!-- Tailwind CSS v3 Estável via CDN -->
    <script src="https://tailwindcss.com"></script>
    <!-- Google Fonts & Material Icons -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Roboto:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        body { font-family: 'Roboto', sans-serif; }
        textarea, code { font-family: 'JetBrains Mono', monospace; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24 }
    </style>
</head>
<body class="bg-[#f8f9fa] text-[#3c4043] min-h-screen flex flex-col">

    <!-- Header / Navbar (Estilo Google Google) -->
    <header class="bg-white border-b border-[#e0e0e0] px-6 py-3 flex items-center justify-between">
        <div class="flex items-center space-x-2">
            <span class="material-symbols-outlined text-[#1a73e8] text-2xl">translate</span>
            <span class="text-xl text-[#5f6368] font-normal tracking-tight">git<span class="text-[#1a73e8] font-medium">-translate</span></span>
        </div>
        <div>
            <a href="https://github.com" target="_blank" class="text-xs font-medium text-[#5f6368] hover:bg-gray-100 px-3 py-2 rounded-md transition flex items-center space-x-1">
                <span>GitHub Repository</span>
                <span class="material-symbols-outlined text-sm">open_in_new</span>
            </a>
        </div>
    </header>

    <!-- Main Section -->
    <main class="flex-1 max-w-6xl w-full mx-auto p-4 md:py-8 flex flex-col">
        
        <!-- Google Translate Dual-Panel Wrapper -->
        <div class="bg-white rounded-lg shadow-sm border border-[#dialog] border-[#e0e0e0] flex flex-col flex-1 md:min-h-[450px]">
            
            <!-- Language Selectors (Abas Superiores) -->
            <div class="flex items-center justify-between border-b border-[#e0e0e0] px-4 h-12 bg-white rounded-t-lg select-none">
                <!-- Painel Esquerdo (Origem) -->
                <div class="flex items-center space-x-6 h-full flex-1">
                    <button class="text-[#1a73e8] border-b-2 border-[#1a73e8] px-2 h-full text-sm font-medium tracking-wide">
                        JavaScript Object
                    </button>
                    <button class="text-[#5f6368] px-2 h-full text-sm font-medium tracking-wide hidden sm:block opacity-50 cursor-not-allowed">
                        JSON Data
                    </button>
                </div>

                <!-- Botão de Swap Central -->
                <div class="px-2">
                    <button class="p-2 rounded-full hover:bg-gray-100 text-[#5f6368] flex items-center justify-center transition">
                        <span class="material-symbols-outlined">swap_horiz</span>
                    </button>
                </div>

                <!-- Painel Direito (Destino) -->
                <div class="flex items-center justify-between h-full flex-1 pl-4">
                    <button class="text-[#1a73e8] border-b-2 border-[#1a73e8] px-2 h-full text-sm font-medium tracking-wide">
                        Pure CSS
                    </button>
                    
                    <!-- Botão Traduzir Principal -->
                    <button id="translateBtn" class="bg-[#1a73e8] hover:bg-[#1557b0] text-white text-sm font-medium px-6 py-1.5 rounded shadow-sm transition flex items-center space-x-1">
                        <span>Translate</span>
                    </button>
                </div>
            </div>

            <!-- Content Area (Textareas Side-by-Side) -->
            <div class="grid grid-cols-1 md:grid-cols-2 divide-y md:divide-y-0 md:divide-x divide-[#e0e0e0] flex-1">
                
                <!-- Input Column -->
                <div class="relative flex flex-col p-4 bg-white min-h-[220px] md:min-h-full">
                    <textarea id="inputCode" placeholder="Paste your code here..." class="w-full h-full resize-none border-0 p-1 text-lg text-[#202124] focus:ring-0 focus:outline-none placeholder-[#80868b]" spellcheck="false">{
  backgroundColor: "indigo",
  padding: "16px",
  borderRadius: "8px",
  color: "#ffffff"
}</textarea>
                    
                    <!-- Bottom Controls (Input) -->
                    <div class="flex items-center justify-between mt-auto pt-2">
                        <span class="text-xs text-[#80868b]">Source Code</span>
                        <button id="clearBtn" class="p-2 rounded-full hover:bg-gray-100 text-[#5f6368] transition" title="Clear text">
                            <span class="material-symbols-outlined text-xl block">close</span>
                        </button>
                    </div>
                </div>

                <!-- Output Column -->
                <div class="relative flex flex-col p-4 bg-[#f8f9fa] min-h-[220px] md:min-h-full">
                    <textarea id="outputCode" readonly placeholder="Translation" class="w-full h-full resize-none border-0 p-1 text-lg text-[#202124] bg-transparent focus:ring-0 focus:outline-none placeholder-[#80868b]" spellcheck="false"></textarea>
                    
                    <!-- Bottom Controls (Output) -->
                    <div class="flex items-center justify-between mt-auto pt-2">
                        <span class="text-xs text-[#80868b]">Compiled CSS</span>
                        <button id="copyBtn" class="p-2 rounded-full hover:bg-gray-100 text-[#5f6368] transition flex items-center space-x-1" title="Copy code">
                            <span class="material-symbols-outlined text-xl block">content_copy</span>
                            <span id="copyText" class="text-xs font-medium hidden px-1">Copy</span>
                        </button>
                    </div>
                </div>

            </div>
        </div>

        <!-- Rodapé Discreto -->
        <p class="text-center text-xs text-[#70757a] mt-6">
            git-translate Engine Alpha &middot; Converts structures into client-safe production semantics.
        </p>

    </main>

    <!-- Core Translation JavaScript Logic -->
    <script>
        const inputCode = document.getElementById('inputCode');
        const outputCode = document.getElementById('outputCode');
        const translateBtn = document.getElementById('translateBtn');
        const clearBtn = document.getElementById('clearBtn');
        const copyBtn = document.getElementById('copyBtn');
        const copyText = document.getElementById('copyText');

        function jsToCss(jsString) {
            try {
                let cleaned = jsString.trim();
                if (!cleaned.startsWith('{')) cleaned = `{${cleaned}}`;
                
                const obj = new Function(`return ${cleaned}`)();
                
                let cssResult = ".translated-style {\n";
                for (const [key, value] of Object.entries(obj)) {
                    const cssProperty = key.replace(/([A-Z])/g, "-$1").toLowerCase();
                    cssResult += `  ${cssProperty}: ${value};\n`;
                }
                cssResult += "}";
                return cssResult;
            } catch (error) {
                return `/* Syntax Error */\nCould not compile structure. Ensure it is a valid JavaScript Object format.`;
            }
        }

        // Trigger translation on click
        translateBtn.addEventListener('click', () => {
            const source = inputCode.value;
            if(!source.trim()) {
                outputCode.value = "";
                return;
            }
            outputCode.value = jsToCss(source);
        });

        // Clear panel
        clearBtn.addEventListener('click', () => {
            inputCode.value = '';
            outputCode.value = '';
        });

        // Copy functionality
        copyBtn.addEventListener('click', () => {
            if(!outputCode.value) return;
            navigator.clipboard.writeText(outputCode.value);
            copyText.classList.remove('hidden');
            copyText.textContent = "Copied!";
            setTimeout(() => { copyText.classList.add('hidden'); }, 2000);
        });

        // Run initially on load
        window.addEventListener('DOMContentLoaded', () => {
            if(inputCode.value.trim()) outputCode.value = jsToCss(inputCode.value);
        });
    </script>
</body>
</html>
